<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>Brasla_ · Watch Party</title>
<link rel="stylesheet" href="style.css">

<!-- Vercel Web Analytics (static site, no npm needed) -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<!-- Vercel Speed Insights (static site, no npm needed) -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="app" id="app">

  <!-- ============ TOP BAR (floating) ============ -->
  <header class="bar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Watch Party</div>
        <div class="brand-channel">Brasla_</div>
      </div>
    </div>

    <nav class="views" id="views" aria-label="Zobrazení">
      <button class="view-btn" data-view="screen"><span class="dot" id="screen-dot"></span>Obrazovka</button>
      <button class="view-btn" data-view="both">Obojí</button>
    </nav>

    <div class="bar-right">
      <div class="menu-wrap">
        <button class="chip-btn twitch-btn" id="twitch-btn" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M4.3 3 3 6.4v13.1h4.5V22h2.6l2.5-2.5h3.8L21 14.6V3H4.3Zm14.9 10.6-2.6 2.6h-4.2l-2.3 2.3v-2.3H7.8V4.8h11.4v8.8Zm-2.6-5.2v4.5h-1.7V8.4h1.7Zm-4.6 0v4.5h-1.7V8.4H12Z"/></svg>
          Twitch
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu" id="twitch-menu" hidden role="menu">
          <button class="menu-item" id="twitch-login" role="menuitem">Přihlásit přes Twitch<small>Stream i chat se po přihlášení obnoví</small></button>
          <button class="menu-item" id="twitch-logout" role="menuitem">Odhlásit z Twitche<small>Otevře Twitch, kde se odhlásíš</small></button>
          <button class="menu-item" id="twitch-reload" role="menuitem">Obnovit stream a chat</button>
        </div>
      </div>
      <button class="chip-btn" id="host-btn" title="Přihlášení hosta">HOST</button>
      <button class="chip-btn icon" id="chat-toggle" title="Zobrazit / skrýt chat" aria-label="Chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12Z"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ STAGE ============ -->
  <main class="stage" id="stage" data-view="both">

    <!-- Screen share -->
    <section class="tile" id="tile-screen">
      <div class="bubble" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>
        <span class="bubble-dot" id="bubble-screen-dot"></span>
      </div>
      <div class="tile-media" id="screen-stage">
        <div class="empty" id="screen-empty-msg">Nikdo zrovna nesdílí obrazovku</div>
        <video id="screen-video" autoplay playsinline muted disablepictureinpicture></video>
        <button class="btn play-overlay" id="screen-play-btn" style="display:none;">▶ Klepni pro přehrání</button>
      </div>

      <div class="tile-label">
        <span class="tile-name">Obrazovka</span>
        <span class="sync-pill" id="screen-pill">offline</span>
      </div>
      <div class="tile-tools">
        <button class="tile-btn only-floating" data-min="screen" title="Sbalit do ikony" aria-label="Sbalit do ikony"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="tile-btn" data-float="screen" title="Plovoucí okno / přichytit zpět" aria-label="Plovoucí okno">
          <svg class="ic-pop" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="12" height="10" rx="2"/><path d="M9 19h10a2 2 0 0 0 2-2V9"/></svg>
          <svg class="ic-dock" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
        </button>
        <button class="tile-btn" data-fs="screen" title="Celá obrazovka" aria-label="Celá obrazovka"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
      <div class="tile-drag" data-drag="screen"></div>
      <div class="tile-resize" data-resize="screen" title="Změnit velikost"></div>

      <!-- host controls -->
      <div class="dock" id="screen-controls" style="display:none;">
        <div class="dock-main">
          <button class="btn" id="screen-start-btn">Začít sdílet obrazovku</button>
          <button class="btn danger" id="screen-stop-btn" style="display:none;">Ukončit sdílení</button>
          <div class="dock-status" id="screen-status">Nesdílíš.</div>
        </div>
        <div class="dock-tip">V okně prohlížeče vyber obrazovku, okno nebo kartu. Pro zvuk zvol kartu (nebo „celá obrazovka“) a zaškrtni sdílení zvuku.</div>
      </div>

      <!-- viewer info -->
      <div class="toast" id="screen-viewer-note"></div>
      <button class="btn toast-btn" id="screen-retry-btn" style="display:none;">Znovu připojit</button>
    </section>

    <!-- drag handle between the two tiles -->
    <div class="split" id="split-tiles" role="separator" aria-label="Změnit velikost oken" tabindex="0" title="Táhni pro změnu velikosti (dvojklik = vyrovnat)"><span></span></div>

    <!-- Twitch stream -->
    <section class="tile" id="tile-stream">
      <div class="bubble" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M4.3 3 3 6.4v13.1h4.5V22h2.6l2.5-2.5h3.8L21 14.6V3H4.3Zm14.9 10.6-2.6 2.6h-4.2l-2.3 2.3v-2.3H7.8V4.8h11.4v8.8Zm-2.6-5.2v4.5h-1.7V8.4h1.7Zm-4.6 0v4.5h-1.7V8.4H12Z"/></svg>
      </div>
      <div class="tile-media" id="frame-twitch">
        <div id="twitch-embed"></div>
      </div>
      <div class="tile-label">
        <span class="tile-name">Stream</span>
        <span class="sync-pill is-twitch">Twitch</span>
      </div>
      <div class="tile-tools">
        <button class="tile-btn only-floating" data-min="stream" title="Sbalit do ikony" aria-label="Sbalit do ikony"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="tile-btn" data-float="stream" title="Plovoucí okno / přichytit zpět" aria-label="Plovoucí okno">
          <svg class="ic-pop" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="12" height="10" rx="2"/><path d="M9 19h10a2 2 0 0 0 2-2V9"/></svg>
          <svg class="ic-dock" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
        </button>
        <button class="tile-btn" data-fs="stream" title="Celá obrazovka" aria-label="Celá obrazovka"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
      <div class="tile-drag" data-drag="stream"></div>
      <div class="tile-resize" data-resize="stream" title="Změnit velikost"></div>
    </section>
  </main>

  <!-- ============ CHAT (docked column, bottom sheet on phones) ============ -->
  <aside id="chat-sidebar" class="chat">
    <div class="split-chat" id="split-chat" role="separator" aria-label="Změnit šířku chatu" tabindex="0" title="Táhni pro změnu šířky (dvojklik = výchozí)"><span></span></div>
    <div class="chat-head">
      <span class="chat-title">Chat</span>
      <button class="chip-btn icon" id="chat-sidebar-close" title="Skrýt chat" aria-label="Skrýt chat">✕</button>
    </div>
    <div class="chat-body">
      <iframe id="twitch-chat" src="" title="Twitch chat"></iframe>
    </div>
  </aside>
  <button id="chat-sidebar-tab" title="Zobrazit chat">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12Z"/></svg>
    <span>Chat</span>
  </button>
</div>

<div class="app-toast" id="app-toast" role="status" hidden></div>

<!-- HOST LOGIN (in-page) -->
<div id="host-modal" class="modal" hidden>
  <form class="modal-card" id="host-form" autocomplete="off">
    <div class="modal-title">Přihlášení hosta</div>
    <div class="modal-sub">Zadej heslo hosta pro sdílení obrazovky.</div>
    <input type="password" id="host-pass" class="input" placeholder="Heslo" autocomplete="current-password">
    <div class="modal-error" id="host-error" role="alert"></div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="host-cancel">Zrušit</button>
      <button type="submit" class="btn" id="host-submit">Přihlásit</button>
    </div>
  </form>
</div>

<script src="https://embed.twitch.tv/embed/v1.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="screen.js"></script>

</body>
</html>
